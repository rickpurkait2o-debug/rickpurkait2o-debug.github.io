<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick Purkait - Official Website</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
            text-align: center;
            position: relative;
        }
        
        /* ওয়াটারমার্ক স্টাইল (ব্যাকগ্রাউন্ডে RICK PURKAIT লেখা) */
        body::before {
            content: "RICK PURKAIT";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 70px;
            font-weight: bold;
            color: rgba(0, 0, 0, 0.035); /* হালকা রঙের ওয়াটারমার্ক */
            white-space: nowrap;
            pointer-events: none;
            z-index: -1;
        }

        header {
            background-color: #1a252f;
            color: white;
            padding: 40px 20px;
        }
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
            margin-bottom: 15px;
        }
        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: left;
        }
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 8px;
        }
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        .gallery-img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        footer {
            margin-top: 40px;
            padding: 20px;
            color: #7f8c8d;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <header>
        <img src=Screenshot_20260719-215145_Photos.jpg.jpg" alt="Rick Purkait" class="profile-img">
        <h1>Rick Purkait</h1>
        <p>Personal Website</p>
    </header>

    <div class="container">
        <h2>About Me</h2>
        <p>Hello, I am Rick Purkait. Welcome to my official website.</p>
        
        <h2>My Photo Gallery</h2>
        <div class="gallery">
            <!-- আপনার আপলোড করা ছবির সঠিক নাম 'photo1.jpg' ও 'photo2.jpg' এর জায়গায় লিখে দিন -->
            <img src="photo1.jpg" alt="Gallery Image 1" class="gallery-img">
            <img src="photo2.jpg" alt="Gallery Image 2" class="gallery-img">
        </div>

        <h2>Contact</h2>
        <p>Email: rickpurkait@example.com</p>
    </div>

    <footer>
        <p>© 2026 | All Rights Reserved</p>
    </footer>

</body>
</html>
